<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted SEO comparison workflow</title><desc id="desc">A workflow from topic selection through research, writing, QA and preview publishing, with traceability and control gates.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#182c43}.t{font-size:27px;font-weight:700}.l{font-size:15px;font-weight:700}.s{font-size:12px;fill:#586778}.b{fill:#fff;stroke:#cfe1f3;stroke-width:2}.blue{fill:#eaf5ff;stroke:#1d85ed}.gate{fill:#fff7dd;stroke:#d49a00}.line{stroke:#6a8bae;stroke-width:2;fill:none}.dash{stroke:#6a8bae;stroke-width:2;stroke-dasharray:6 5;fill:none}</style>
  <rect width="1200" height="500" fill="#f6fbff"/><text x="55" y="55" class="t">AI-assisted SEO comparison workflow</text><text x="55" y="80" class="s">Structured evidence, focused skills, explicit quality gates and controlled publishing</text>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#6a8bae"/></marker></defs>
  <g transform="translate(55 135)"><rect class="b blue" width="145" height="70" rx="10"/><text x="72" y="30" text-anchor="middle" class="l">Topic selection</text><text x="72" y="50" text-anchor="middle" class="s">SERP + demand</text><rect class="b gate" x="175" width="145" height="70" rx="10"/><text x="247" y="30" text-anchor="middle" class="l">Human approval</text><text x="247" y="50" text-anchor="middle" class="s">scope + budget</text><rect class="b blue" x="350" width="105" height="70" rx="10"/><text x="402" y="40" text-anchor="middle" class="l">Research</text><rect class="b" x="485" width="88" height="70" rx="10"/><text x="529" y="40" text-anchor="middle" class="l">Brief</text><rect class="b" x="603" width="88" height="70" rx="10"/><text x="647" y="40" text-anchor="middle" class="l">Assets</text><rect class="b" x="721" width="88" height="70" rx="10"/><text x="765" y="40" text-anchor="middle" class="l">Writer</text><rect class="b gate" x="839" width="88" height="70" rx="10"/><text x="883" y="40" text-anchor="middle" class="l">QA</text><path class="line" marker-end="url(#a)" d="M145 35h25m150 0h25m110 0h25m88 0h25m88 0h25m88 0h25"/></g>
  <g transform="translate(410 275)"><rect class="b gate" width="165" height="70" rx="10"/><text x="82" y="30" text-anchor="middle" class="l">Human review</text><text x="82" y="50" text-anchor="middle" class="s">publication decision</text><rect class="b blue" x="210" width="165" height="70" rx="10"/><text x="292" y="30" text-anchor="middle" class="l">Website export</text><text x="292" y="50" text-anchor="middle" class="s">build + tests</text><rect class="b blue" x="420" width="165" height="70" rx="10"/><text x="502" y="30" text-anchor="middle" class="l">Preview publish</text><text x="502" y="50" text-anchor="middle" class="s">GitHub → Cloudflare</text><path class="line" marker-end="url(#a)" d="M473 -72v-8M165 35h40m170 0h40"/></g>
  <g transform="translate(55 395)"><rect class="b" width="330" height="62" rx="10"/><text x="17" y="25" class="l">Traceability</text><text x="17" y="46" class="s">Sources, claim IDs, dated pricing, citations and handoff hashes</text><rect class="b" x="380" width="345" height="62" rx="10"/><text x="397" y="25" class="l">Control gates</text><text x="397" y="46" class="s">Scope, budget, billing, QA and human-approval stops</text><rect class="b" x="770" width="370" height="62" rx="10"/><text x="787" y="25" class="l">Optional DataForSEO boundary</text><text x="787" y="46" class="s">Bounded requests, explicit confirmation and source responses</text></g>
</svg>
